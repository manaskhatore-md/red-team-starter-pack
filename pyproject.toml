# Optional. `uv pip install -e .` (or `pip install -e .`), once from the repo root,
# adds the rt command (redteam/cli.py), so `rt scan` works from any folder. Without
# it, run .\rt (Windows) or ./rt from the repo root instead.
#
# This installs the command only. The kit's dependencies stay in requirements.txt
# (uv pip install -r requirements.txt, or the same with plain pip), so uv and pip
# users install from one list. The kit runs from this clone: -e (editable) points rt
# at these files, so a git pull needs no reinstall.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "red-team-starter-pack"
version = "0.1.0"
description = "AI red-teaming kit for state agency pilots: the rt command"
dependencies = []

[project.scripts]
rt = "redteam.cli:main"

[tool.setuptools]
# Only the command's own package. The kit's modules run from the clone (see above).
packages = ["redteam"]

# Ruff, the linter: it reads the code without running it and flags likely mistakes.
# It runs in the pre-commit hooks (.pre-commit-config.yaml) and on every pull request
# (.github/workflows/lint.yml). To run it yourself, from the repo root:
#
#   ruff check .
#
# The rule set starts small on purpose, so each finding is worth reading:
#   F  pyflakes: unused imports and variables, names used before they exist, a name
#      redefined by accident.
#   B  bugbear: patterns that are usually bugs, e.g. a closure that captures a loop
#      variable, or a mutable default argument.
# Add more rules (import order, then a formatter) in their own pull requests.
[tool.ruff.lint]
select = ["F", "B"]
ignore = [
    # zip() without strict=: adding strict= changes behavior (it raises when the
    # lengths differ), so it is a per-call decision, not a lint fix.
    "B905",
]
