# Automated red team gate on pull requests.
#
# WHAT THIS IS FOR: catching regressions, not finding new vulnerabilities. Once a
# finding is remediated, its probe belongs here so the fix cannot silently come
# undone - by a prompt edit, a model version bump, or a config change. Discovery work
# (the multi-turn campaigns, the bias pairs, anything needing backend verification) is
# manual and belongs in a scheduled assessment, not on every PR.
#
# WHY IT MATTERS MORE FOR LLMs THAN FOR NORMAL CODE: your dependencies change
# underneath you. A vendor can update the model serving your endpoint without telling
# you, and a guardrail that held last month stops holding. The scheduled run below is
# the part that catches that.
#
# TODO: this workflow is disabled by default (see the `if:` on the job). Before you
# enable it, work through the checklist at the bottom of this file - a CI gate that
# fires on noise gets disabled within a week, and a gate everyone ignores is worse
# than no gate.

name: Red Team CI Gate

on:
  pull_request:
    paths:
      # Only run when something that affects model behavior changes.
      # TODO: add the paths to YOUR application's prompts, tool definitions, and
      # RAG configuration. Those are the files whose edits can break a guardrail.
      - "datasets/**"
      - "judges/**"
      - "pyrit_campaigns/**"
      - "prompts/**"
      # - "src/your_app/prompts/**"
      # - "src/your_app/tools/**"
  schedule:
    # Weekly drift check. TODO: match this to your vendor's release cadence.
    # This catches the failure mode CI usually cannot: nothing in your repo changed,
    # but the model behind your endpoint did.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  single-turn-scan:
    runs-on: ubuntu-latest
    # TODO: DELETE THIS LINE TO ENABLE. Left in so a fork does not immediately start
    # spending API credits on every PR before anyone has tuned the thresholds.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run single-turn scan
        env:
          # TODO: add these as repository secrets (Settings > Secrets and variables >
          # Actions). Never inline a key in this file.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only if you gate against a deployed app. Use a NON-PRODUCTION endpoint -
          # CI runs unattended and will hit it on every PR.
          APP_ENDPOINT: ${{ secrets.APP_ENDPOINT }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          # TODO: pick the profile matching your deployment type, and a judge that is
          # not the model under test.
          RT_PROFILE: public_conversational
          RT_PROVIDER: gemini
          RT_JUDGE_PROVIDER: anthropic
          # Makes a policy violation fail the job. Unset for a report-only run - see
          # the phased rollout below.
          RT_FAIL_ON_FINDING: "1"
        run: python -m pyrit_campaigns.single_turn_scan | tee scan-output.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          # The PyRIT database holds the full transcript and every score; the text
          # log is the human-readable summary.
          path: |
            scan-output.txt
            ~/.pyrit/dbdata/
          # TODO: these artifacts contain every prompt and response from the run. If
          # you ever gate against a system holding real data, they inherit that
          # classification - shorten the retention and restrict who can download
          # them, or redact before upload.
          retention-days: 30

      # TODO: phase the gate in rather than switching it on. Recommended sequence:
      #
      #   Phase 1 (weeks 1-4): report only. Unset RT_FAIL_ON_FINDING and read the
      #     output. You are calibrating the rubrics, not the application.
      #   Phase 2: hard-fail on deterministic signals only - a canary token appearing
      #     in a response does not vary run to run, so a failure is real. (You have to
      #     add those assertions; see the profile checklists in profiles.py.)
      #   Phase 3: enable RT_FAIL_ON_FINDING once you know the rubrics'
      #     false-positive rate from Phase 1 history.
      #
      # LLM output is stochastic, so a single rubric finding may be sampling noise.
      # That is why the deterministic canary checks are the ones worth blocking on
      # first, and why a finding should be re-run before anyone acts on it.

  # TODO: a second job for grounding, once judges/rag_grounding_eval.py has an eval
  # set. It exits non-zero below your grounded-rate threshold, which makes
  # hallucination a blocking condition like any other test failure.
  #
  # grounding-eval:
  #   runs-on: ubuntu-latest
  #   if: false
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: "3.12" }
  #     - run: pip install -r requirements.txt
  #     - run: python -m judges.rag_grounding_eval
  #       env:
  #         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

# ---------------------------------------------------------------------------
# CHECKLIST BEFORE ENABLING
# ---------------------------------------------------------------------------
# [ ] Provider API keys added as repository secrets, for the target AND the judge
# [ ] A profile in pyrit_campaigns/profiles.py customized for your real system, with
#     the placeholder values filled in
# [ ] Rubrics in judges/state_policy_rubric.yaml rewritten against your actual policy
# [ ] Regression probes added to datasets/ for every finding you have already
#     remediated - this is the actual payload of the gate; generic probes protect
#     nothing specific
# [ ] Run it manually (workflow_dispatch) enough times to know the baseline finding
#     rate, since the rubrics are themselves LLM calls and will not be perfectly stable
# [ ] Cost estimated: probes x rubrics x runs per week x per-call cost, and remember
#     every probe costs a target call PLUS a judge call per rubric
# [ ] If gating against a deployed app: NON-PRODUCTION endpoint confirmed, and the
#     app owner knows CI will be calling it
# [ ] Decided who triages a failure and whether it can be overridden - an unownable
#     red gate gets bypassed, and then it protects nothing
#
# NOTE ON GITHUB ENTERPRISE: if this repo lives on a GHE instance, confirm your
# runners can reach PyPI and your model provider's API. Self-hosted runners behind a
# TLS-inspecting proxy may need pip index configuration and truststore (see
# requirements.txt), and third-party actions may need org allow-listing.
