# Automated red team gate on pull requests.
#
# WHAT THIS IS FOR: catching regressions, not finding new vulnerabilities. Once a
# finding is remediated, its probe belongs here so the fix cannot silently come
# undone - by a prompt edit, a model version bump, or a config change. Discovery work
# (the PyRIT campaigns, the bias pairs, anything needing backend verification) is
# manual and belongs in a scheduled assessment, not on every PR.
#
# WHY IT MATTERS MORE FOR LLMs THAN FOR NORMAL CODE: your dependencies change
# underneath you. A vendor can update the model serving your endpoint without telling
# you, and a guardrail that held last month stops holding. The scheduled run below is
# the part that catches that.
#
# TODO: this workflow is disabled by default (see the `if:` on the job). Before you
# enable it, work through the checklist at the bottom of this file - a CI gate that
# fires on noise gets disabled within a week, and a gate everyone ignores is worse
# than no gate.

name: Red Team CI Gate

on:
  pull_request:
    paths:
      # Only run when something that affects model behavior changes.
      # TODO: add the paths to YOUR application's prompts, tool definitions, and
      # RAG configuration. Those are the files whose edits can break a guardrail.
      - "configs/**"
      - "datasets/**"
      - "judges/**"
      - "prompts/**"
      # - "src/your_app/prompts/**"
      # - "src/your_app/tools/**"
  schedule:
    # Weekly drift check. TODO: match this to your vendor's release cadence.
    # This catches the failure mode CI usually cannot: nothing in your repo changed,
    # but the model behind your endpoint did.
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  promptfoo-scan:
    runs-on: ubuntu-latest
    # TODO: DELETE THIS LINE TO ENABLE. Left in so a fork does not immediately start
    # spending API credits on every PR before anyone has tuned the thresholds.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache promptfoo results
        uses: actions/cache@v4
        with:
          path: ~/.promptfoo/cache
          key: promptfoo-${{ hashFiles('configs/**', 'datasets/**') }}
          restore-keys: promptfoo-
        # The cache is a cost control, not an optimization: identical
        # prompt+provider pairs are not re-billed. It also means an unchanged test
        # will not re-run against a changed model - use the scheduled run (which you
        # may want to run with --no-cache) to catch drift.

      - name: Run Promptfoo eval
        env:
          # TODO: add these as repository secrets (Settings > Secrets and variables >
          # Actions). Never inline a key in this file.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Only if you gate against a deployed app. Use a NON-PRODUCTION endpoint -
          # CI runs unattended and will hit it on every PR.
          APP_ENDPOINT: ${{ secrets.APP_ENDPOINT }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          # TODO: pick the profile matching your deployment type. Running all four
          # wastes credits - most repos hold one application.
          npx promptfoo@latest eval \
            -c configs/02_public_conversational.yaml \
            -o results.json \
            --no-progress-bar

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-results
          path: results.json
          # TODO: results.json contains every prompt and response from the run. If
          # you ever gate against a system holding real data, this artifact inherits
          # that classification - shorten the retention and restrict who can download
          # it, or redact before upload.
          retention-days: 30

      # TODO: implement the gate. `promptfoo eval` exits non-zero when assertions
      # fail, so the step above already fails the build - which is probably too
      # blunt to start with. Recommended sequence:
      #
      #   Phase 1 (weeks 1-4): report only. Add `|| true` to the eval step and post
      #     results as a PR comment. Watch what fails and why. You are calibrating
      #     the tests, not the application.
      #   Phase 2: hard-fail on deterministic assertions only (not-contains, canary
      #     tokens, regex). These do not vary run to run, so a failure is real.
      #   Phase 3: add a threshold on the llm-rubric assertions once you have enough
      #     history to know their false-positive rate.
      #
      # LLM outputs are stochastic. A single failing rubric assertion may be sampling
      # noise - which is why temperature: 0 is set in the configs and why the
      # deterministic assertions are the ones worth blocking on.
      #
      # - name: Post results to PR
      #   if: github.event_name == 'pull_request'
      #   uses: promptfoo/promptfoo-action@v1
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     config: configs/02_public_conversational.yaml

  # TODO: a second job for grounding, once judges/rag_grounding_eval.py has an eval
  # set. It exits non-zero below your grounded-rate threshold, which makes
  # hallucination a blocking condition like any other test failure.
  #
  # grounding-eval:
  #   runs-on: ubuntu-latest
  #   if: false
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: "3.12" }
  #     - run: pip install -r requirements.txt
  #     - run: python -m judges.rag_grounding_eval
  #       env:
  #         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

# ---------------------------------------------------------------------------
# CHECKLIST BEFORE ENABLING
# ---------------------------------------------------------------------------
# [ ] Provider API key added as a repository secret
# [ ] A profile in configs/ customized with your real system prompt
# [ ] Regression probes added for every finding you have already remediated - this
#     is the actual payload of the gate; a generic config protects nothing specific
# [ ] Run it manually (workflow_dispatch) enough times to know the baseline pass rate
# [ ] Cost estimated: (tests x providers x runs per week) x per-call cost. A large
#     matrix on a busy repo adds up faster than people expect
# [ ] If gating against a deployed app: NON-PRODUCTION endpoint confirmed, and the
#     app owner knows CI will be calling it
# [ ] Decided who triages a failure and whether it can be overridden - an unownable
#     red gate gets bypassed, and then it protects nothing
#
# NOTE ON GITHUB ENTERPRISE: if this repo lives on a GHE instance, confirm that
# `npx promptfoo@latest` and the actions above are reachable from your runners.
# Self-hosted runners behind a proxy may need npm registry configuration, and
# third-party actions may need to be allow-listed by your org's policy.
