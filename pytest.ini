# Offline test suite - see tests/conftest.py. Run with: python -m pytest
[pytest]
# Only tests/.
testpaths = tests
# Strict xfail is how known bugs are tracked - see tests/conftest.py.
xfail_strict = true
# --strict-markers: a misspelt mark is an error, not a test that silently runs unmarked.
# --durations: every run ends with its slowest tests over a second, so a slow one shows.
addopts = --strict-markers --durations=15 --durations-min=1.0
markers =
    house_style: the pack's own rubric wording, which the kit does not rely on. A fork that
        rewords its rubrics turns these off: add -m "not house_style" to addopts above.
        rubrics.check still holds every rubric file to what the kit does rely on.
